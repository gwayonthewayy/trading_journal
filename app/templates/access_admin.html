{% extends "base.html" %}
{% block page_header %}
<section class="page-head">
  <h1>Admin Unlock</h1>
  <p>관리자 링크 확인 후 비밀번호를 입력하세요.</p>
</section>
{% endblock %}

{% block content %}
<section class="card">
  <div class="card-head">
    <h3>Administrator Login</h3>
    <p>성공하면 관리자 세션이 발급됩니다.</p>
  </div>
  <form method="post" action="/access/admin/{{ token }}/unlock">
    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password" />
    </label>
    <button type="submit">Unlock Admin</button>
    {% if error %}
    <div class="error">Error: {{ error }}</div>
    {% endif %}
  </form>
</section>
{% endblock %}
